[project]
name = "conduit-test-framework"
version = "0.1.0"
description = "Advanced multi-layer SDET automation framework for the Conduit (RealWorld) application."
requires-python = ">=3.12"
dependencies = [
    "allure-pytest>=2.13.5",
    "faker>=37.0.0",
    "httpx>=0.28.1",
    "locust>=2.32.0",
    "playwright>=1.40.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pytest>=8.3.0",
    "pytest-env>=1.1.5",
    "pytest-playwright>=0.4.0",
    "pytest-xdist>=3.6.1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14.0",
    "ruff>=0.9.0",
    "types-requests>=2.32.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["config*", "api_client*", "ai_engine*", "data_factory*", "ui_pages*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "--alluredir=allure-results"
markers = [
    "smoke: fast critical-path checks",
    "regression: broader functional coverage",
    "security: security-related scenarios",
    "contract: API contract validation",
    "demo: AI RCA demonstration excluded from default CI",
]
env = [
    "BASE_URL=http://localhost:8000/api",
    "UI_BASE_URL=http://localhost:4200",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "ANN",
]
ignore = [
    "ANN401",
]

[tool.ruff.lint.isort]
known-first-party = ["ai_engine", "api_client", "config", "data_factory", "ui_pages"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
exclude = ["performance/"]

[[tool.mypy.overrides]]
module = [
    "allure.*",
    "faker.*",
    "playwright.*",
    "pydantic.*",
    "pydantic_settings.*",
]
ignore_missing_imports = true
