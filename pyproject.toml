[project]
name = "conduit-test-framework"
version = "0.1.0"
description = "Enterprise test automation framework for the Conduit (RealWorld) application."
requires-python = ">=3.12"
dependencies = [
    "allure-pytest>=2.13.5",
    "faker>=37.0.0",
    "httpx>=0.28.1",
    "locust>=2.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pytest>=8.3.0",
    "pytest-env>=1.1.5",
    "pytest-xdist>=3.6.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "--alluredir=allure-results"
env = [
    "BASE_URL=http://localhost:8000/api",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "ANN",
]
ignore = [
    "ANN401",
]

[tool.ruff.lint.isort]
known-first-party = ["api_client", "config"]
