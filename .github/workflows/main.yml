name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

env:
  PYTHON_VERSION: "3.12"
  BASE_URL: http://localhost:8000/api
  UI_BASE_URL: http://localhost:4200
  PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

jobs:
  lint:
    name: Linter & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy src config scripts

  test:
    name: Test Execution Layer
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Start SUT
        run: docker compose -f app/docker-compose.yml up -d --build

      - name: Wait for backend
        run: python scripts/wait_for_backend.py

      - name: Start mock UI
        run: |
          python scripts/mock_conduit_ui_server.py &
          sleep 2
          curl -sf http://localhost:4200/ > /dev/null

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run API tests
        run: pytest tests/api/ -v --alluredir=allure-results

      - name: Run UI tests
        run: pytest tests/ui/ -v --alluredir=allure-results

      - name: Run load smoke test
        run: >
          locust -f performance/locustfile.py --headless
          -u 10 -r 5 --run-time 30s
          --host http://localhost:8000/api
          --html performance/locust_report.html

      - name: Run security scan
        if: always()
        run: |
          chmod 777 ${{ github.workspace }}/security
          docker run --rm --network host \
            -v "${{ github.workspace }}/security:/zap/wrk/:rw" \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost:8000/api \
            -c zap_baseline.conf \
            -r zap_baseline_report.html || true
          docker run --rm --network host \
            -v "${{ github.workspace }}/security:/zap/wrk/:rw" \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py \
            -t http://localhost:8000/openapi.json \
            -f openapi \
            -r zap_api_report.html || true

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-test-results
          path: |
            allure-results/
            security/*_report.html
            performance/locust_report.html
          if-no-files-found: ignore

      - name: Stop SUT
        if: always()
        run: docker compose -f app/docker-compose.yml down -v

  report:
    name: Reporting
    runs-on: ubuntu-latest
    needs: test
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Test Results
        uses: actions/download-artifact@v4
        with:
          name: all-test-results
          path: downloaded-artifacts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Allure CLI & Generate Report
        run: |
          npm install -g allure-commandline --save-dev
          
          # Генерируем Allure отчет
          allure generate downloaded-artifacts/allure-results -o allure-report --clean
          
          # Копируем отчеты ZAP и Locust в папку сайта (allure-report)
          cp downloaded-artifacts/security/*_report.html allure-report/ || true
          cp downloaded-artifacts/performance/locust_report.html allure-report/ || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          keep_files: true
    
  notify:
    name: Send Telegram Notification
    runs-on: ubuntu-latest
    needs: report
    if: always() && github.ref == 'refs/heads/main'
    steps:
      - name: Send Notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚀 CI/CD Pipeline Completed!
            Repository: ${{ github.repository }}
            
            ✅ Все отчеты обновлены и доступны:
            📊 Функционал (Allure): https://artyomzabello.github.io/Myportfolio/
            📈 Нагрузка (Locust): https://artyomzabello.github.io/Myportfolio/locust_report.html
            🛡️ Security (API Scan): https://artyomzabello.github.io/Myportfolio/zap_api_report.html
            🛡️ Security (Baseline): https://artyomzabello.github.io/Myportfolio/zap_baseline_report.html
    
    
