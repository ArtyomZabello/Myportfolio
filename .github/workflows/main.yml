name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

env:
  PYTHON_VERSION: "3.12"
  BASE_URL: http://localhost:8000/api
  UI_BASE_URL: http://localhost:4200
  PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  ALLOW_SECURITY_FAILURES: "false"
  ALLOW_LOAD_FAILURES: "false"
  DOCKER_BUILDKIT: "1"
  COMPOSE_DOCKER_CLI_BUILD: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Linter & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy src config scripts tests

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start SUT
        run: |
          docker compose -f app/docker-compose.yml pull --quiet 2>/dev/null || true
          docker compose -f app/docker-compose.yml up -d --build --quiet-pull

      - name: Wait for backend
        run: python scripts/wait_for_backend.py

      - name: Run API tests
        run: pytest tests/api/ -m "not demo" -v --alluredir=allure-results

      - name: Upload API Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-api-results
          path: allure-results/
          if-no-files-found: ignore

      - name: Stop SUT
        if: always()
        run: docker compose -f app/docker-compose.yml down -v

  ui-tests:
    name: UI Tests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright/python:v1.60.0-noble
      options: --ipc=host --init
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-ui-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-ui-

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Start mock UI
        run: |
          python scripts/mock_conduit_ui_server.py &
          python scripts/wait_for_ui.py

      - name: Run UI tests
        run: >
          pytest tests/ui/ -m "not demo" -v --alluredir=allure-results
          --tracing=retain-on-failure
          --screenshot=only-on-failure
          --video=retain-on-failure

      - name: Upload UI Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-ui-results
          path: allure-results/
          if-no-files-found: ignore

      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore

  load-security:
    name: Load & Security
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start SUT
        run: |
          docker compose -f app/docker-compose.yml pull --quiet 2>/dev/null || true
          docker compose -f app/docker-compose.yml up -d --build --quiet-pull

      - name: Wait for backend
        run: python scripts/wait_for_backend.py

      - name: Generate Locust dataset
        run: python performance/seed_load_data.py generate

      - name: Verify Locust dataset
        run: python performance/seed_load_data.py verify

      - name: Run load smoke test
        run: >
          locust -f performance/locustfile.py --headless
          -u 10 -r 5 --run-time 30s
          --host http://localhost:8000/api
          --html performance/locust_report.html
          --exit-code-on-error 1

      - name: Enforce Locust thresholds
        run: python scripts/check_locust_thresholds.py

      - name: Run security scans
        if: always()
        run: |
          chmod 777 ${{ github.workspace }}/security
          python scripts/run_security_scans.py

      - name: Upload HTML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-reports
          path: |
            security/*_report.html
            performance/locust_report.html
          if-no-files-found: ignore

      - name: Stop SUT
        if: always()
        run: docker compose -f app/docker-compose.yml down -v

  ai-demo:
    name: AI RCA Demo
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Start SUT
        run: |
          docker compose -f app/docker-compose.yml pull --quiet 2>/dev/null || true
          docker compose -f app/docker-compose.yml up -d --build --quiet-pull

      - name: Wait for backend
        run: python scripts/wait_for_backend.py

      - name: Run AI RCA demo test
        run: pytest tests/api/test_auth_negative.py -m demo -v --alluredir=allure-results
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Upload demo Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-demo-results
          path: allure-results/
          if-no-files-found: ignore

      - name: Stop SUT
        if: always()
        run: docker compose -f app/docker-compose.yml down -v

  report:
    name: Reporting
    runs-on: ubuntu-latest
    needs: [api-tests, ui-tests, load-security]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Allure results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: allure-*-results
          merge-multiple: true
          path: merged-allure-results

      - name: Download HTML reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: html-reports
          path: downloaded-html-reports

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm global packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-global-${{ runner.os }}-allure
          restore-keys: |
            npm-global-${{ runner.os }}-

      - name: Install Allure CLI & Generate Report
        run: |
          npm install -g allure-commandline --save-dev

          mkdir -p allure-input
          if [ -d merged-allure-results ]; then
            find merged-allure-results -type f \( -name '*.json' -o -name '*.xml' -o -name '*.png' -o -name '*.txt' -o -name '*.attach' \) -exec cp {} allure-input/ \;
          fi

          if [ -n "$(find allure-input -type f -print -quit)" ]; then
            allure generate allure-input -o allure-report --clean
          else
            echo "No Allure result files found — creating placeholder report."
            mkdir -p allure-report
            printf '%s\n' \
              '<!DOCTYPE html><html><head><title>Allure Report</title></head>' \
              '<body><p>No test results were available for this pipeline run.</p></body></html>' \
              > allure-report/index.html
          fi

          if [ -d downloaded-html-reports ]; then
            find downloaded-html-reports -type f -name '*_report.html' -exec cp {} allure-report/ \; 2>/dev/null || true
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          keep_files: true

  notify:
    name: Send Telegram Notification
    runs-on: ubuntu-latest
    needs: report
    if: always() && github.ref == 'refs/heads/main'
    timeout-minutes: 5
    steps:
      - name: Send Notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚀 CI/CD Pipeline Completed!
            Repository: ${{ github.repository }}

            ✅ Все отчеты обновлены и доступны:
            📊 Функционал (Allure): https://artyomzabello.github.io/Myportfolio/
            📈 Нагрузка (Locust): https://artyomzabello.github.io/Myportfolio/locust_report.html
            🛡️ Security (API Scan): https://artyomzabello.github.io/Myportfolio/zap_api_report.html
            🛡️ Security (Baseline): https://artyomzabello.github.io/Myportfolio/zap_baseline_report.html
