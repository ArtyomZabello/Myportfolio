name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

env:
  PYTHON_VERSION: "3.12"
  BASE_URL: http://localhost:8000/api
  UI_BASE_URL: http://localhost:4200
  PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

jobs:
  lint:
    name: Linter & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy src config scripts

  test:
    name: Test Execution Layer
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Start SUT
        run: docker compose -f app/docker-compose.yml up -d --build

      - name: Wait for backend
        run: python scripts/wait_for_backend.py

      - name: Start mock UI
        run: |
          python scripts/mock_conduit_ui_server.py &
          sleep 2
          curl -sf http://localhost:4200/ > /dev/null

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run API tests
        run: pytest tests/api/ -v --alluredir=allure-results

      - name: Run UI tests
        run: pytest tests/ui/ -v --alluredir=allure-results

      - name: Run load smoke test
        run: >
          locust -f performance/locustfile.py --headless
          -u 10 -r 5 --run-time 30s
          --host http://localhost:8000/api

      - name: Run security scan
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}/security:/zap/wrk/:rw" \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost:8000/api \
            -c zap_baseline.conf \
            -r zap_report.html || true

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: |
            allure-results/
            security/zap_report.html
          if-no-files-found: ignore

      - name: Stop SUT
        if: always()
        run: docker compose -f app/docker-compose.yml down -v

  report:
    name: Reporting
    runs-on: ubuntu-latest
    needs: test
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: downloaded-artifacts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Allure CLI & Generate Report
        run: |
          npm install -g allure-commandline --save-dev
          # Указываем правильный вложенный путь к результатам тестов
          allure generate downloaded-artifacts/allure-results -o allure-report --clean

      - name: Deploy Allure report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          keep_files: true
